<title>Finishing sign-in</title>
<style>

<body>
<h1>Finishing sign-in…</h1>
<p>Passing the sign-in back to Channel Publisher on this computer. If nothing happens, check that the
publisher is still waiting for you to sign in, then try again.</p>
<script>
  // Instagram only redirects to https pages, so this page forwards the sign-in reply to the publisher
  // listening on this same computer. It only ever goes to localhost.
  location.replace("http://localhost:8765/callback" + location.search);
</script>
</body>
